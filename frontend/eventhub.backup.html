<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EventHub – Discover &amp; Register for Events</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f8f8fd;--surf:#fff;--ink:#17163a;--mute:#4a4a68;--line:#e3e3f0;--p:#5a32e0;--p2:#4a24cc;--soft:#ece8ff;--shadow:0 6px 22px rgba(60,40,140,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surf);z-index:30}
button,input,select{font:inherit;color:inherit}
svg{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surf);box-shadow:0 1px 8px rgba(40,30,110,.08)}
.bar{max-width:1440px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:24px;min-height:74px}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:30px;letter-spacing:-.02em;color:var(--ink);text-decoration:none;margin-right:auto}
.logo .lg{width:42px;height:42px;font-size:42px;color:var(--p);stroke-width:1.8}
nav{display:flex;gap:6px;position:absolute;left:50%;transform:translateX(-50%)}
nav button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:10px;padding:11px 18px;font-size:18px;font-weight:500;cursor:pointer;color:var(--ink)}
nav button svg{font-size:24px}
nav button[aria-current=page]{background:var(--soft);color:var(--p)}
.user{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:500}
.av{width:42px;height:42px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-size:24px}
main{max-width:1440px;margin:0 auto;padding:24px 24px 48px}

.hero h1{margin:0 0 20px;font-size:clamp(30px,4vw,48px);line-height:1.1;font-weight:700;letter-spacing:-.02em;max-width:640px}
.hero h1 em{font-style:normal;color:#a98bff}
.hero p{margin:0 0 28px;font-size:clamp(16px,1.7vw,23px);line-height:1.4;max-width:620px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid transparent;border-radius:10px;background:var(--p);color:#fff;font-weight:600;cursor:pointer;padding:12px 18px;transition:background .15s}
.btn:hover{background:var(--p2)}
.btn.out{background:var(--surf);color:var(--p);border-color:var(--line)}
.btn.out:hover{background:var(--soft)}
.hero .btn{background:#5a35e8;padding:16px 30px;font-size:20px;border-radius:12px;box-shadow:0 6px 18px rgba(30,10,120,.4)}
.btn svg{font-size:1.15em}
.filters{display:grid;grid-template-columns:1fr 275px 290px;gap:24px;margin:30px 0 0}
.field{position:relative;display:flex;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:12px;height:54px;padding:0 20px;gap:14px;color:var(--mute)}
.field svg{font-size:23px}
.field input,.field select{flex:1;min-width:0;border:0;background:none;outline:0;height:100%;font-size:18px;color:var(--ink);appearance:none;-webkit-appearance:none;cursor:pointer}
.field input{cursor:text}.field input::placeholder{color:var(--mute)}
.field select option{color:#000}
.field .ch{position:absolute;right:18px;pointer-events:none;font-size:20px;color:var(--ink)}
.field:focus-within,.btn:focus-visible,nav button:focus-visible,.card button:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:34px 0 24px}
.head h2{margin:0;font-size:clamp(26px,3vw,34px);font-weight:700;letter-spacing:-.01em}
.head .btn{padding:14px 20px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:2px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.ph{position:relative;height:152px;border-radius:14px 14px 0 0;overflow:hidden;background:#1a1450}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:24px;bottom:0;color:#fff;font-size:16px;font-weight:500;padding:7px 16px;border-radius:16px 16px 0 0}
.tag.Conference{background:#5a32e0}.tag.Workshop{background:#2f72f0}.tag.Summit{background:#1fa05a}.tag.Hackathon{background:#d9480f}
.cb{padding:16px 22px 22px;display:flex;flex-direction:column;gap:11px;flex:1}
.cb h3{margin:0 0 3px;font-size:22px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:13px;font-size:17px;color:var(--mute)}
.row svg{font-size:21px;color:var(--mute)}
.act{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:auto;padding-top:12px}
.act .btn{padding:15px 10px;font-size:18px;font-weight:500;width:100%}
.act .btn.on{background:#1fa05a}
.empty{grid-column:1/-1;text-align:center;padding:56px 16px;color:var(--mute);background:var(--surf);border:1px dashed var(--line);border-radius:16px}
dialog{border:0;border-radius:18px;padding:0;width:min(480px,calc(100% - 32px));background:var(--surf);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(15,10,50,.55)}
.dl{padding:24px;display:flex;flex-direction:column;gap:14px}
.dl h3{margin:0;font-size:22px}.dl label{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:15px}
.dl input,.dl select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;font-size:16px}
.dl .act{padding:0;margin:0}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}nav button span{display:none}nav button{padding:11px 14px}.filters{grid-template-columns:1fr 1fr}.filters .field:first-child{grid-column:1/-1}.hero{padding:36px 36px}}
@media(max-width:680px){
.bar{padding:10px 16px;min-height:62px;gap:12px}
.logo{font-size:24px;gap:9px}.logo .lg{width:34px;height:34px;font-size:34px}
.user b{display:none}.av{width:38px;height:38px}
nav{position:fixed;left:0;right:0;bottom:0;transform:none;justify-content:space-around;background:var(--surf);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:25}
nav button{flex-direction:column;gap:3px;font-size:12px;padding:6px 14px;flex:1}nav button span{display:block}nav button svg{font-size:22px}
main{padding:16px 16px 96px}

.hero p{margin-bottom:22px}.hero .btn{padding:14px 22px;font-size:17px}
.filters{grid-template-columns:1fr;gap:12px;margin-top:20px}.field{height:50px}.field input,.field select{font-size:16px}
.head{margin:26px 0 16px}.head .btn{padding:11px 14px;font-size:15px}
.grid{grid-template-columns:1fr;gap:20px}
.act{gap:12px}.act .btn{font-size:16px}
}
.user{position:relative}
.av{font-size:18px;font-weight:600}
.who{display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;font-size:18px;font-weight:500;border-radius:10px;padding:4px}
.who svg{font-size:20px}
.user>.btn{padding:11px 20px;font-size:17px}
.menu{position:absolute;right:0;top:56px;background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(40,30,110,.18);min-width:220px;padding:8px;z-index:40}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:16px}
.menu button:hover{background:var(--soft)}
dialog{max-height:calc(100dvh - 32px);overflow:auto}
.dl .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dl .btn{width:100%;padding:13px 16px;font-size:17px}
.sum{display:flex;gap:14px;align-items:center;background:var(--bg);border-radius:12px;padding:10px}
.sum img{width:96px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:4px}
.tabs button{border:0;background:none;padding:9px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--mute)}
.tabs button.on{background:var(--surf);color:var(--p);box-shadow:0 1px 4px rgba(40,30,110,.15)}
.err{color:#c62828;font-size:14px;margin:0;min-height:1.2em}
.note{font-size:14px;color:var(--mute);margin:0}
.dl .chk{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400}
.dl .chk input{margin-top:3px;width:auto}
.ticket{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center}
.code{font-size:30px;font-weight:700;letter-spacing:.08em;color:var(--p)}
@media(max-width:480px){.dl .two{grid-template-columns:1fr}.dl{padding:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var users=ld('eh_users',{}),sess=ld('eh_session',''),regs=ld('eh_regs',[]),view='home';
var $=function(s){return document.querySelector(s)};
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML.replace(/"/g,'&quot;')}
function me(){return sess&&users[sess]?users[sess]:null}
function owner(){return me()?sess:'guest'}
function evById(id){return E.filter(function(e){return e.id==id})[0]}
function taken(e){return regs.reduce(function(a,r){return a+(r.eid==e.id?r.qty:0)},0)}
function count(e){return e.n+taken(e)}
function myReg(e){return regs.filter(function(r){return r.eid==e.id&&r.owner===owner()})[0]}
function hash(s){if(!window.crypto||!crypto.subtle)return Promise.resolve(btoa(unescape(encodeURIComponent(s))));return crypto.subtle.digest('SHA-256',new TextEncoder().encode('eh:'+s)).then(function(h){return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}
function open(h){$('#dlb').innerHTML=h;if(!$('#dlg').open)$('#dlg').showModal()}
function close(){if($('#dlg').open)$('#dlg').close()}
function err(m){$('#er').textContent=m}
function act(e){var r=myReg(e);r?ticket(r):regForm(e)}

function render(){
 var q=$('#q').value.trim().toLowerCase(),c=$('#cat').value,past=$('#when').value==='past';
 var L=past?[]:E.filter(function(e){return(!c||e.c===c)&&(view!=='mine'||myReg(e))&&(!q||(e.t+e.c+e.l).toLowerCase().indexOf(q)>-1)});
 $('#title').textContent=view==='mine'?'My Registrations':past?'Past Events':'Upcoming Events';
 $('#grid').innerHTML=L.length?L.map(function(e){var r=myReg(e),full=!r&&count(e)>=e.m;
  return '<article class="card"><div class="ph"><img src="'+e.img+'" alt="" loading="lazy"><span class="tag '+e.c+'">'+esc(e.c)+'</span></div><div class="cb"><h3>'+esc(e.t)+'</h3><div class="row">'+I.pin+esc(e.l)+'</div><div class="row">'+I.cal+esc(e.d)+'</div><div class="row">'+I.ppl+count(e)+' / '+e.m+' registered</div><div class="act"><button class="btn out" data-d="'+e.id+'">View Details</button><button class="btn'+(r?' on':'')+'" data-r="'+e.id+'"'+(full?' disabled':'')+'>'+(r?'View Ticket':full?'Sold Out':'Register Now')+'</button></div></div></article>'}).join(''):
  '<div class="empty">'+(view==='mine'?'You have not registered for any events yet.':'No events match your search.')+'</div>';
}
function userUI(){var u=me(),el=$('#user');
 if(!u){el.innerHTML='<button class="btn out" id="si">Sign in</button>';$('#si').onclick=function(){acct('up')};return}
 el.innerHTML='<button class="who" id="who" aria-haspopup="true"><span class="av">'+esc(u.name.charAt(0).toUpperCase())+'</span><b>'+esc(u.name)+'</b>'+I.chev+'</button>';
 $('#who').onclick=function(ev){ev.stopPropagation();var m=$('#menu');if(m){m.remove();return}
  var d=document.createElement('div');d.className='menu';d.id='menu';
  d.innerHTML='<div class="note" style="padding:8px 12px">'+esc(sess)+'</div><button data-a="mine">My Registrations</button><button data-a="out">Sign out</button>';el.appendChild(d);
  d.onclick=function(e){var a=e.target.dataset.a;if(a==='mine')go('mine');if(a==='out'){sess='';sv('eh_session','');userUI();render()}d.remove()}}}
document.addEventListener('click',function(){var m=$('#menu');if(m)m.remove()});

function acct(mode,after){
 var up=mode==='up';
 open('<h3>'+(up?'Create account':'Sign in')+'</h3><div class="tabs"><button data-m="up" class="'+(up?'on':'')+'">Create account</button><button data-m="in" class="'+(up?'':'on')+'">Sign in</button></div>'+(up?'<label>Full name<input id="an" autocomplete="name"></label>':'')+'<label>Email<input id="ae" type="email" autocomplete="email"></label><label>Password<input id="ap" type="password" autocomplete="'+(up?'new-password':'current-password')+'"></label><p class="err" id="er"></p><button class="btn" id="go">'+(up?'Create account':'Sign in')+'</button><p class="note">Optional. Your account is saved only in this browser, and you can register for events without one.</p>');
 $('.tabs').onclick=function(e){if(e.target.dataset.m)acct(e.target.dataset.m,after)};
 $('#go').onclick=function(){
  var em=$('#ae').value.trim().toLowerCase(),pw=$('#ap').value,nm=up?$('#an').value.trim():'';
  if(up&&!nm)return err('Enter your full name.');
  if(!/^\S+@\S+\.\S+$/.test(em))return err('Enter a valid email address.');
  if(up&&pw.length<6)return err('Use a password with at least 6 characters.');
  if(up&&users[em])return err('An account with this email already exists. Sign in instead.');
  if(!up&&!users[em])return err('No account found for this email. Create one first.');
  hash(pw).then(function(h){
   if(!up&&users[em].h!==h)return err('Wrong email or password.');
   if(up){users[em]={name:nm,h:h};sv('eh_users',users)}
   sess=em;sv('eh_session',em);
   regs.forEach(function(r){if(r.owner==='guest')r.owner=em});sv('eh_regs',regs);
   userUI();render();close();if(after)after()})}}

function regForm(e){var u=me(),mx=Math.max(1,Math.min(5,e.m-count(e))),o='';
 for(var i=1;i<=mx;i++)o+='<option>'+i+'</option>';
 open('<h3>Register for event</h3><div class="sum"><img src="'+e.img+'" alt=""><div><b>'+esc(e.t)+'</b><p class="note">'+esc(e.d)+'<br>'+esc(e.l)+'</p></div></div>'
 +'<div class="two"><label>Full name<input id="rn" autocomplete="name" value="'+esc(u?u.name:'')+'"></label><label>Email<input id="re" type="email" autocomplete="email" value="'+esc(u?sess:'')+'"></label></div>'
 +'<div class="two"><label>Phone<input id="rp" type="tel" autocomplete="tel" value="'+esc(u&&u.phone)+'"></label><label>Tickets<select id="rq">'+o+'</select></label></div>'
 +'<label>College or company (optional)<input id="ro" value="'+esc(u&&u.org)+'"></label>'
 +'<label class="chk"><input type="checkbox" id="rt"><span>I agree to receive event updates and follow the event rules.</span></label><p class="err" id="er"></p>'
 +'<div class="act"><button class="btn out" data-x>Cancel</button><button class="btn" id="rs">Confirm registration</button></div>'
 +(u?'':'<p class="note">Have an account? <a href="#" id="rsi">Sign in</a> to fill this in automatically.</p>'));
 if($('#rsi'))$('#rsi').onclick=function(ev){ev.preventDefault();acct('in',function(){regForm(e)})};
 $('#rs').onclick=function(){
  var nm=$('#rn').value.trim(),em=$('#re').value.trim().toLowerCase(),ph=$('#rp').value.trim(),og=$('#ro').value.trim();
  if(!nm)return err('Enter your full name.');
  if(!/^\S+@\S+\.\S+$/.test(em))return err('Enter a valid email address.');
  if(ph.replace(/\D/g,'').length<7)return err('Enter a valid phone number.');
  if(!$('#rt').checked)return err('Please accept the terms to continue.');
  if(count(e)+ +$('#rq').value>e.m)return err('Not enough seats left for that many tickets.');
  var r={code:'EH-'+Math.random().toString(36).slice(2,8).toUpperCase(),eid:e.id,owner:owner(),name:nm,email:em,phone:ph,org:og,qty:+$('#rq').value,at:Date.now()};
  regs.push(r);sv('eh_regs',regs);
  if(me()){users[sess].phone=ph;users[sess].org=og;sv('eh_users',users)}
  render();ticket(r,true)}}

function ticket(r,nw){var e=evById(r.eid);
 open('<h3>'+(nw?'You’re registered!':'Your ticket')+'</h3><div class="ticket"><p class="note">Confirmation code</p><div class="code">'+r.code+'</div><p style="font-weight:600;margin:6px 0 2px">'+esc(e.t)+'</p><p class="note">'+esc(e.d)+' • '+esc(e.l)+'</p><p class="note" style="margin-top:8px">'+esc(r.name)+' • '+r.qty+(r.qty>1?' tickets':' ticket')+'</p></div>'+(me()||!nw?'':'<p class="note">Want to keep your tickets together? <a href="#" id="mk">Create a free account</a>.</p>')+'<div class="act"><button class="btn out" data-c="'+r.code+'">Cancel registration</button><button class="btn" data-x>Done</button></div>');
 if($('#mk'))$('#mk').onclick=function(ev){ev.preventDefault();acct('up',function(){ticket(r)})}}

$('#dlg').onclick=function(ev){var b=ev.target.closest('button');
 if(ev.target===$('#dlg')||(b&&b.hasAttribute('data-x')))return close();
 if(!b)return;
 if(b.dataset.rr){close();act(evById(b.dataset.rr))}
 if(b.dataset.c){if(!b.dataset.s){b.dataset.s=1;b.textContent='Tap again to confirm';return}
  regs=regs.filter(function(r){return r.code!==b.dataset.c});sv('eh_regs',regs);close();render()}};
$('#grid').onclick=function(ev){var b=ev.target.closest('button');if(!b)return;
 if(b.dataset.r)act(evById(b.dataset.r));
 if(b.dataset.d){var e=evById(b.dataset.d);
  open('<h3>'+esc(e.t)+'</h3><div class="row">'+I.pin+esc(e.l)+'</div><div class="row">'+I.cal+esc(e.d)+'</div><p style="margin:0;color:var(--mute)">'+esc(e.about)+'</p><div class="act"><button class="btn out" data-x>Close</button><button class="btn" data-rr="'+e.id+'">'+(myReg(e)?'View Ticket':'Register Now')+'</button></div>')}};
$('#create').onclick=function(){open('<h3>Create Event</h3><label>Title<input id="nt"></label><label>Category<select id="nc"><option>Conference</option><option>Workshop</option><option>Summit</option><option>Hackathon</option></select></label><label>Location<input id="nl"></label><label>Date and time<input id="nd" placeholder="Sat, Apr 5, 2025 • 10:00 AM"></label><div class="act"><button class="btn out" data-x>Cancel</button><button class="btn" id="save">Create Event</button></div>');
 $('#save').onclick=function(){var t=$('#nt').value.trim();if(!t){$('#nt').focus();return}
  var c=$('#nc').value,base=E.filter(function(x){return x.c===c})[0]||E[0];
  E.unshift({id:Date.now(),t:t,c:c,l:$('#nl').value.trim()||'To be announced',d:$('#nd').value.trim()||'Date to be announced',n:0,m:100,img:base.img,about:'Created by you.'});
  close();go('events')}};
function sync(){document.querySelectorAll('nav button').forEach(function(b){if(b.dataset.v===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#hero').style.display=view==='home'?'':'none'}
function go(v){view=v;sync();render();window.scrollTo({top:0})}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){go(b.dataset.v)}});
$('#browse').onclick=function(){$('#q').scrollIntoView({behavior:'smooth',block:'center'})};
['input','change'].forEach(function(t){['#q','#cat','#when'].forEach(function(s){$(s).addEventListener(t,render)})});
userUI();render();
</script></body></html>
