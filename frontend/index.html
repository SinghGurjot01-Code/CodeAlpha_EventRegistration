<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EventHub – Discover &amp; Register for Events</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header><div class="bar">
<a class="logo" href="#"><svg class="lg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M8.5 13l2.5 2.5 4.5-5"/></svg>EventHub</a>
<nav aria-label="Main"><button data-v="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg><span>Home</span></button><button data-v="events"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8 15h3"/></svg><span>Events</span></button><button data-v="mine"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M8.5 14l2.5 2.5 4.5-5"/></svg><span>My Registrations</span></button></nav>
<div class="user" id="user"></div>
</div></header>
<main>
<section class="hero" id="hero"><h1>Discover &amp; Register for <br>Exciting <em>Events</em></h1><p>Find workshops, conferences, hackathons and more.<br>Register in just a few clicks!</p><button class="btn" id="browse"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8 15h3"/></svg>Browse Events<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></section>
<div class="filters">
<label class="field"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg><input id="q" type="search" placeholder="Search events by title, category or location..." aria-label="Search events"></label>
<label class="field"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><select id="cat" aria-label="Category"><option value="">All Categories</option><option>Conference</option><option>Workshop</option><option>Summit</option><option>Hackathon</option></select><svg class="ch" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></label>
<label class="field"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8 15h3"/></svg><select id="when" aria-label="When"><option value="up">Upcoming</option><option value="past">Past</option></select><svg class="ch" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></label>
</div>
<div class="head"><h2 id="title">Upcoming Events</h2><button class="btn" id="create"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Create Event</button></div>
<div class="grid" id="grid" aria-live="polite"></div>
</main>
<dialog id="dlg"><div class="dl" id="dlb"></div></dialog>
<script src="assets/event-images.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body></html>
